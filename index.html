<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wickedbad.music</title>
    <meta
      name="description"
      content="wickedbad.music - experimental audio archive, noise studies, and signal transmissions."
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Site Frame -->
    <div class="site-shell">
      <!-- Primary Navigation -->
      <header class="site-header">
        <nav class="site-nav" aria-label="Primary">
          <a class="brand glitch" href="#" aria-label="wickedbad.music home" data-text="wickedbad.music">wickedbad.music</a>
          <ul class="nav-links">
            <li><a href="#archive">Archive</a></li>
            <li><a href="#noise">Noise</a></li>
            <li><a href="#signals">Signals</a></li>
          </ul>
        </nav>
      </header>

      <!-- Main Experimental Canvas -->
      <main class="main-grid" id="main-content">
        <section class="panel" id="archive" aria-labelledby="archive-title">
          <h1 id="archive-title">Archive</h1>
          <p>Catalog fragments, recordings, and iterations.</p>
        </section>

        <section class="panel" id="noise" aria-labelledby="noise-title">
          <h2 id="noise-title">Noise</h2>
          <p>Textural studies and controlled distortion.</p>
        </section>

        <section class="panel" id="signals" aria-labelledby="signals-title">
          <h2 id="signals-title">Signals</h2>
          <p>Broadcasts, field notes, and upcoming transmissions.</p>
        </section>
      </main>

      <!-- Footer -->
      <footer class="site-footer">
        <small>&copy; <span id="year">2026</span> wickedbad.music</small>
      </footer>
    </div>

    <script src="js/main.js"></script>
